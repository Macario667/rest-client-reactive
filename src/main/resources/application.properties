quarkus.tls.trust-all=true

# Dirección base de la API externa
quarkus.rest-client.extensions-api.url=https://stage.code.quarkus.io/api

# Máximo de espera para establecer la conexión (Expresada en milisegundos)
quarkus.rest-client.extensions-api.connect-timeout=3000

# Máximo de espera para recibir la respuesta después de conectar (Expresada en milisegundos)
quarkus.rest-client.extensions-api.read-timeout=5000

# el cliente realmente deja de esperar cuando una API tarda demasiado.
%test.quarkus.rest-client.extensions-api.read-timeout=1000

# Seguir redirecciones del servidor
quarkus.rest-client.extensions-api.follow-redirects=true

# Limitar el número de redirecciones
quarkus.rest-client.extensions-api.max-redirects=5

# Registrar peticiones y respuestas del cliente
quarkus.rest-client.extensions-api.logging.scope=request-response

# Limitar el cuerpo registrado
quarkus.rest-client.extensions-api.logging.body-limit=100

# Ocultar cabeceras sensibles en los logs
quarkus.rest-client.extensions-api.logging.masked-headers=Authorization,Cookie,X-API-Key

# inspeccionar respuestas de error sin que el mapper predeterminado lance una excepción automáticamente
quarkus.rest-client.extensions-api.disable-default-mapper=true